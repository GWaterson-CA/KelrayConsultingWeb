title: "Fast Fun Learning / Xandrium Storefront"
client_name: "Fast Fun Learning"
client_website: "https://www.fastfunlearning.com"
summary: "A story-led digital storefront for the illustrated Xandrium world, designed to introduce the series and sell its ebook and musical audiobook directly."

industry: "Education & Publishing"
work_types:
  - "Website build"
  - "E-commerce"

problem: |
  An original fantasy series needs a digital experience that can communicate its world quickly, preserve the impact of its artwork, and make it straightforward for parents and readers to understand what is available.

  Fast Fun Learning needed a direct-to-reader home for Xandrium that could bring the visual identity of the story into the buying experience rather than presenting the book as a generic catalogue item.

approach: |
  The project shaped the website around the Xandrium artwork and the first title, “Because of an Angry Dragon…”. The storefront uses large-format story imagery, a focused navigation structure, reviews and press, and a direct path to the available digital formats.

  The experience was implemented as an e-commerce site so the client could manage product content and sell the ebook and musical audiobook directly while keeping the story world at the centre of the design.

deliverables:
  - "Story-led responsive website"
  - "Direct-to-reader e-commerce storefront"
  - "Digital product presentation"
  - "Reviews, press, FAQs, and contact content"
  - "Client-manageable product and website content"

tools:
  - "Shopify development"
  - "E-commerce experience design"
  - "Responsive front-end development"
  - "Content and product architecture"

results: |
  Fast Fun Learning gained a public storefront that makes the Xandrium artwork and story the first impression, then gives interested readers a direct route to the ebook and musical audiobook.

  The finished experience supports both storytelling and commerce without separating the two into disconnected sites. [Visit the Xandrium storefront](https://www.fastfunlearning.com).

