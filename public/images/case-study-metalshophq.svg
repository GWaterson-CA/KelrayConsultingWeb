<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">MetalShopHQ job board</title>
  <desc id="desc">A dark job-shop operations board with work moving from quoting through build and invoicing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="1070" cy="90" r="230" fill="#f97316" opacity=".08"/>
  <circle cx="110" cy="650" r="270" fill="#38bdf8" opacity=".07"/>
  <g transform="translate(70 55)">
    <rect width="1060" height="590" rx="28" fill="#f8fafc" filter="url(#shadow)"/>
    <rect width="1060" height="78" rx="28" fill="#0f1f33"/>
    <rect y="50" width="1060" height="28" fill="#0f1f33"/>
    <g transform="translate(28 21)">
      <path d="M18 0 34 9v18l-16 9L2 27V9z" fill="url(#orange)"/>
      <text x="50" y="26" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">MetalShop<tspan fill="#fb923c">HQ</tspan></text>
      <text x="860" y="24" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">LIVE JOB BOARD</text>
    </g>
    <g transform="translate(28 112)" font-family="Arial, sans-serif">
      <text x="0" y="0" font-size="15" font-weight="700" fill="#475569">QUOTING</text>
      <text x="258" y="0" font-size="15" font-weight="700" fill="#475569">DRAWING</text>
      <text x="516" y="0" font-size="15" font-weight="700" fill="#475569">IN BUILD</text>
      <text x="774" y="0" font-size="15" font-weight="700" fill="#475569">READY TO INVOICE</text>
      <g transform="translate(0 26)">
        <rect width="230" height="146" rx="16" fill="#fff" stroke="#dbe3ed"/>
        <rect width="6" height="146" rx="3" fill="#f59e0b"/>
        <text x="24" y="34" font-size="12" font-weight="700" fill="#f59e0b">JOB #1048</text>
        <text x="24" y="65" font-size="18" font-weight="700" fill="#172033">Custom stair guards</text>
        <text x="24" y="92" font-size="13" fill="#64748b">Quote due Friday</text>
        <rect x="24" y="110" width="82" height="22" rx="11" fill="#fff7ed"/>
        <text x="37" y="126" font-size="11" fill="#c2410c">Estimating</text>
      </g>
      <g transform="translate(258 26)">
        <rect width="230" height="146" rx="16" fill="#fff" stroke="#dbe3ed"/>
        <rect width="6" height="146" rx="3" fill="#3b82f6"/>
        <text x="24" y="34" font-size="12" font-weight="700" fill="#2563eb">JOB #1041</text>
        <text x="24" y="65" font-size="18" font-weight="700" fill="#172033">Dock bracket package</text>
        <text x="24" y="92" font-size="13" fill="#64748b">3 drawings attached</text>
        <rect x="24" y="110" width="96" height="22" rx="11" fill="#eff6ff"/>
        <text x="37" y="126" font-size="11" fill="#1d4ed8">Review needed</text>
      </g>
      <g transform="translate(516 26)">
        <rect width="230" height="146" rx="16" fill="#fff" stroke="#dbe3ed"/>
        <rect width="6" height="146" rx="3" fill="#10b981"/>
        <text x="24" y="34" font-size="12" font-weight="700" fill="#059669">JOB #1029</text>
        <text x="24" y="65" font-size="18" font-weight="700" fill="#172033">Entry canopy</text>
        <text x="24" y="92" font-size="13" fill="#64748b">14.5 hours logged</text>
        <rect x="24" y="110" width="74" height="22" rx="11" fill="#ecfdf5"/>
        <text x="37" y="126" font-size="11" fill="#047857">On floor</text>
      </g>
      <g transform="translate(774 26)">
        <rect width="230" height="146" rx="16" fill="#fff" stroke="#dbe3ed"/>
        <rect width="6" height="146" rx="3" fill="#8b5cf6"/>
        <text x="24" y="34" font-size="12" font-weight="700" fill="#7c3aed">JOB #1026</text>
        <text x="24" y="65" font-size="18" font-weight="700" fill="#172033">Equipment platform</text>
        <text x="24" y="92" font-size="13" fill="#64748b">Cost review complete</text>
        <rect x="24" y="110" width="98" height="22" rx="11" fill="#f5f3ff"/>
        <text x="37" y="126" font-size="11" fill="#6d28d9">Ready to send</text>
      </g>
      <g transform="translate(0 210)">
        <rect width="488" height="198" rx="18" fill="#0f1f33"/>
        <text x="24" y="36" font-size="13" font-weight="700" fill="#94a3b8">QUOTED VS. ACTUAL</text>
        <text x="24" y="78" font-size="30" font-weight="700" fill="#fff">Every job informs the next quote.</text>
        <text x="24" y="116" font-size="14" fill="#cbd5e1">Material, labour, parts, and supplier history</text>
        <rect x="24" y="145" width="330" height="12" rx="6" fill="#26394f"/>
        <rect x="24" y="145" width="248" height="12" rx="6" fill="url(#orange)"/>
      </g>
      <g transform="translate(516 210)">
        <rect width="488" height="198" rx="18" fill="#eef2f7" stroke="#dbe3ed"/>
        <text x="24" y="36" font-size="13" font-weight="700" fill="#475569">ONE OPERATIONAL RECORD</text>
        <g transform="translate(24 66)">
          <rect width="132" height="96" rx="14" fill="#fff"/><text x="16" y="30" font-size="12" fill="#64748b">DRAWINGS</text><text x="16" y="62" font-size="23" font-weight="700" fill="#172033">With job</text>
          <rect x="154" width="132" height="96" rx="14" fill="#fff"/><text x="170" y="30" font-size="12" fill="#64748b">TIME</text><text x="170" y="62" font-size="23" font-weight="700" fill="#172033">Live</text>
          <rect x="308" width="132" height="96" rx="14" fill="#fff"/><text x="324" y="30" font-size="12" fill="#64748b">PURCHASING</text><text x="324" y="62" font-size="23" font-weight="700" fill="#172033">Tracked</text>
        </g>
      </g>
    </g>
  </g>
</svg>
