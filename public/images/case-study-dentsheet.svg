    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a6ccb"/><stop offset="1" stop-color="#084e96"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#164c7e" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="1050" cy="110" r="260" fill="#0a6ccb" opacity=".07"/>
  <circle cx="100" cy="670" r="260" fill="#47b9ff" opacity=".09"/>
