      <g transform="translate(28 88)"><text font-size="15" font-weight="700" fill="#12243a">Roof</text><text x="160" font-size="15" fill="#567087">128 dents</text><text x="365" font-size="15" text-anchor="end" font-weight="700" fill="#12243a">$1,200</text></g>
      <g transform="translate(28 130)"><text font-size="15" font-weight="700" fill="#12243a">Hood</text><text x="160" font-size="15" fill="#567087">42 dents</text><text x="365" font-size="15" text-anchor="end" font-weight="700" fill="#12243a">$400</text></g>
      <g transform="translate(28 172)"><text font-size="15" font-weight="700" fill="#12243a">Deck lid</text><text x="160" font-size="15" fill="#567087">12 dents</text><text x="365" font-size="15" text-anchor="end" font-weight="700" fill="#12243a">$120</text></g>
